[project]
name = "alog"
version = "0.1.0"
description = "Agent trajectories, queryable. A SQLite index beside the .jsonl your framework already writes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "cklxx", email = "q1293822641@gmail.com" }]
keywords = ["agent", "trace", "trajectory", "sqlite", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
fast = ["orjson>=3.9"]

[project.urls]
Source = "https://github.com/cklxx/alog"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alog"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
