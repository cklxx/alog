[package]
name = "alog"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Agent trajectories, queryable. A SQLite index beside the .jsonl your framework already writes."
license = "MIT"
repository = "https://github.com/cklxx/alog"
keywords = ["agent", "trace", "trajectory", "sqlite", "observability"]
categories = ["command-line-utilities", "database"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crc32fast = "1"
memchr = "2"
rayon = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
