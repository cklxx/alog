<!DOCTYPE html>
<meta charset="utf-8">
<title>alog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>▤</text></svg>">
<style>
:root {
  --bg: #fbfbfa; --panel: #fff; --line: #e6e4e1; --ink: #1b1a18; --dim: #78736c;
  --faint: #a8a29a; --err: #c0392b; --errbg: #fdf0ee; --acc: #2f6f4f; --hl: #fff3b8;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #161614; --panel: #1d1c19; --line: #302e2a; --ink: #e8e5e0; --dim: #918b82;
    --faint: #6a655d; --err: #e8756a; --errbg: #2a1a18; --acc: #6fbf90; --hl: #4a4220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 -apple-system, system-ui, sans-serif; }
#top { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 9; }
#top b { font-size: 14px; letter-spacing: -.2px; }
#top .s { color: var(--dim); font-size: 12px; }
input[type=search] { flex: 1; max-width: 420px; padding: 5px 9px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--bg); color: var(--ink); font: inherit; }
input[type=search]:focus { outline: none; border-color: var(--acc); }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tabs button { border: 0; background: none; color: var(--dim); font: inherit; cursor: pointer;
  padding: 4px 9px; border-radius: 5px; }
.tabs button.on { background: var(--ink); color: var(--panel); }
#wrap { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 41px); }
#side { border-right: 1px solid var(--line); background: var(--panel); overflow: hidden;
  display: grid; grid-template-rows: auto 1fr; }
#filter { width: 100%; padding: 5px 9px; border: 0; border-bottom: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: 11.5px var(--mono); }
#filter:focus { outline: none; background: var(--bg); }
#list { overflow-y: auto; }
#main { overflow-y: auto; padding: 0 0 40px; }
.sess { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.sess:hover { background: var(--bg); }
.sess.on { background: var(--bg); box-shadow: inset 3px 0 0 var(--acc); }
.sess .n { font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.sess .m { color: var(--faint); font-size: 11px; display: flex; gap: 7px; margin-top: 2px; }
.sess .m .e { color: var(--err); }
table { width: 100%; border-collapse: collapse; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500;
  color: var(--faint); font-size: 11px; padding: 5px 8px; border-bottom: 1px solid var(--line);
  text-transform: uppercase; letter-spacing: .04em; }
td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top;
  font-size: 12px; }
tr.ev:hover { background: var(--panel); }
tr.ev { cursor: pointer; }
tr.err td { background: var(--errbg); }
tr.err td.k { color: var(--err); font-weight: 500; }
.seq, .num, .t { font-family: var(--mono); color: var(--faint); font-size: 11px;
  text-align: right; white-space: nowrap; }
.t { color: var(--dim); text-align: left; }
.k { white-space: nowrap; }
.tool { font-family: var(--mono); font-size: 11.5px; color: var(--acc); white-space: nowrap; }
.tg { font-family: var(--mono); font-size: 11.5px; color: var(--dim);
  max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gap td { background: var(--bg); color: var(--faint); font-size: 11px; text-align: center;
  padding: 1px 8px; font-family: var(--mono); }
.snip { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: pre-wrap;
  word-break: break-all; max-height: 3.2em; overflow: hidden; }
.snip mark { background: var(--hl); color: inherit; }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line);
  background: var(--panel); color: var(--dim); font: inherit; padding: 8px; cursor: pointer; }
.more:hover { color: var(--ink); background: var(--bg); }
#rec { position: fixed; right: 0; top: 41px; bottom: 0; width: min(620px, 52vw);
  background: var(--panel); border-left: 1px solid var(--line); overflow: auto;
  padding: 10px 14px; box-shadow: -8px 0 24px rgba(0,0,0,.07); }
#rec pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap;
  word-break: break-word; margin: 0; }
#rec .x { float: right; cursor: pointer; color: var(--faint); font-size: 16px; }
.cards { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line);
  border-bottom: 1px solid var(--line); }
.card { flex: 1 1 128px; background: var(--panel); padding: 8px 11px; }
.card b { display: block; font-size: 17px; font-weight: 500; font-family: var(--mono); }
.card span { color: var(--faint); font-size: 11px; text-transform: uppercase;
  letter-spacing: .04em; }
.bars { padding: 10px 12px; }
.bars h3 { font-size: 11px; color: var(--faint); text-transform: uppercase; margin: 0 0 6px;
  letter-spacing: .04em; font-weight: 500; }
.bar { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 2px; }
.bar i { display: block; height: 9px; background: var(--acc); border-radius: 2px; opacity: .75; }
.bar .lbl { width: 190px; font-family: var(--mono); font-size: 11.5px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.bar .v { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.bar.e i { background: var(--err); }
.empty { padding: 40px 20px; text-align: center; color: var(--faint); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
</style>

<div id="top">
  <b>alog</b>
  <span class="s" id="hdr"></span>
  <input type="search" id="q" placeholder="search all sessions…  fsync   &quot;connection refused&quot;   err*">
  <div class="tabs">
    <button data-v="turns" class="on">Turns</button>
    <button data-v="timeline">Events</button>
    <button data-v="errors">Errors</button>
    <button data-v="stats">Stats</button>
  </div>
</div>

<div id="wrap">
  <div id="side">
    <input id="filter" placeholder="filter sessions…">
    <div id="list"></div>
  </div>
  <div id="main"><div class="empty">pick a session</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = (p, q) => fetch(p + '?' + new URLSearchParams(q)).then(r => r.json());
const esc = s => (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = n => n == null ? '' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : n;
const mb = b => b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : (b/1e6).toFixed(0)+' MB';
const clock = ms => ms ? new Date(ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
const day = ms => ms ? new Date(ms).toLocaleDateString([], {month:'short',day:'numeric'}) : '';

let S = {sessions: [], sid: null, view: 'turns'};

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  S.view = b.dataset.v;
  render();
});

$('#q').onkeydown = e => { if (e.key === 'Enter') search(e.target.value); };

async function boot() {
  const [st, ss] = await Promise.all([api('/stats'), api('/sessions')]);
  S.stats = st; S.sessions = ss;
  $('#hdr').textContent =
    `${num(st.events)} events · ${st.sessions} sessions · ${mb(st.bytes)}` +
    (st.rejects ? ` · ${st.rejects} unparsed` : '');
  $('#filter').oninput = e => sidebar(e.target.value);
  $('#list').onclick = e => {
    const d = e.target.closest('.sess');
    if (!d) return;
    document.querySelectorAll('.sess').forEach(x => x.classList.toggle('on', x === d));
    S.sid = +d.dataset.sid;
    tab('timeline');
  };
  sidebar('');
  if (ss.length) S.sid = ss[0].sid;
  render();
}

function sidebar(needle) {
  const q = needle.trim().toLowerCase();
  const hits = q ? S.sessions.filter(s => s.ext.toLowerCase().includes(q)) : S.sessions;
  $('#list').innerHTML = hits.map(s => `
    <div class="sess${s.sid === S.sid ? ' on' : ''}" data-sid="${s.sid}">
      <div class="n" title="${esc(s.ext)}">${esc(s.ext)}</div>
      <div class="m">
        <span>${day(s.t1)}</span><span>${num(s.n)} ev</span>
        ${s.tok ? `<span>${num(s.tok)} tok</span>` : ''}
        ${s.err ? `<span class="e">${s.err} err</span>` : ''}
      </div>
    </div>`).join('') || '<div class="empty">no match</div>';
}

function tab(v) {
  S.view = v;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  render();
}

function render() {
  if (S.view === 'stats') return stats();
  if (S.view === 'errors') return errors();
  if (S.sid == null) return;
  if (S.view === 'turns') return turns(S.sid);
  timeline(S.sid, 0);
}

/// One row per user request. Click a row to open that turn's events.
async function turns(sid) {
  const d = await api('/turns', {sid});
  if (!d.turns.length) return $('#main').innerHTML =
    '<div class="empty">no turns — this session has no user prompt followed by a reply</div>';
  const out = [];
  let lastDay = '';
  d.turns.forEach((t, i) => {
    const dy = day(t.t0);
    if (dy && dy !== lastDay) { out.push(`<tr class="gap"><td colspan="8">${dy}</td></tr>`); lastDay = dy; }
    const mins = t.t0 && t.t1 ? Math.round((t.t1 - t.t0) / 60000) : '';
    out.push(`<tr class="ev ${t.err ? 'err' : ''}" data-seq="${t.seq}">
      <td class="seq">${i + 1}</td>
      <td class="t">${clock(t.t0)}</td>
      <td class="num">${mins ? mins + 'm' : ''}</td>
      <td class="num">${t.calls}</td>
      <td class="num">${t.tools}</td>
      <td class="num">${t.err ? `<b style="color:var(--err)">${t.err}</b>` : ''}</td>
      <td class="num">${num(t.out)}/${num(t.cache)}</td>
      <td><div class="snip">${esc(t.ask)}</div></td>
    </tr>`);
  });
  $('#main').innerHTML = `<table>
    <thead><tr><th>#</th><th>start</th><th>took</th><th>calls</th><th>tools</th><th>err</th>
    <th>out/cache tok</th><th>asked</th></tr></thead><tbody>${out.join('')}</tbody></table>`;
  $('#main').onclick = e => {
    const tr = e.target.closest('tr.ev');
    if (!tr) return;
    // Set the tab without letting render() reset the window to seq 0.
    S.view = 'timeline';
    document.querySelectorAll('.tabs button').forEach(x =>
      x.classList.toggle('on', x.dataset.v === 'timeline'));
    timeline(sid, +tr.dataset.seq);
  };
}

const PAGE = 400;

// append=true continues the current page; false replaces it, which is what a
// jump from the Turns view needs even though its start is not 0.
async function timeline(sid, start, append) {
  const d = await api('/timeline', {sid, start, limit: PAGE});
  // Day separators are inserted client-side: the boundary depends on the
  // reader's timezone, which the server does not know.
  const out = [];
  let lastDay = append ? S.lastDay : '';
  for (const r of d.rows) {
    const dy = day(r.ts);
    if (dy && dy !== lastDay) {
      out.push(`<tr class="gap"><td colspan="7">${dy}</td></tr>`);
      lastDay = dy;
    }
    const tok = r.in || r.out
      ? `${num(r.in)}/${num(r.out)}${r.cache ? ` +${num(r.cache)}c` : ''}` : '';
    out.push(`<tr class="ev ${r.err ? 'err' : ''}" data-seq="${r.seq}">
      <td class="seq">${r.seq}</td>
      <td class="t">${clock(r.ts)}</td>
      <td class="k">${esc(r.err ? 'ERROR' : r.role || r.kind)}</td>
      <td class="tool">${esc(r.tool || '')}</td>
      <td><div class="snip">${esc(r.target || r.text)}</div></td>
      <td class="num">${tok}</td>
      <td class="num">${r.len > 2048 ? num(r.len) + 'B' : ''}</td>
    </tr>`);
  }
  S.lastDay = lastDay;
  S.seen = (append ? S.seen : 0) + d.rows.length;

  const next = d.rows.length ? d.rows[d.rows.length - 1].seq + 1 : 0;
  const foot = d.rows.length === PAGE
    ? `<button class="more" data-next="${next}">${num(d.n_shown - S.seen)} more</button>`
    : d.hidden ? `<div class="empty">${num(d.hidden)} framework events hidden</div>` : '';

  if (append) {
    $('#main .more')?.remove();
    $('#main tbody').insertAdjacentHTML('beforeend', out.join(''));
    $('#main').insertAdjacentHTML('beforeend', foot);
  } else {
    $('#main').innerHTML = `<table>
      <thead><tr><th>#</th><th>time</th><th>who</th><th>tool</th><th>what</th>
      <th>tok in/out</th><th>size</th></tr></thead>
      <tbody>${out.join('')}</tbody></table>${foot}`;
  }
  $('#main').onclick = e => {
    const m = e.target.closest('.more');
    if (m) return timeline(sid, +m.dataset.next, true);
    const tr = e.target.closest('tr.ev');
    if (tr) show(sid, +tr.dataset.seq);
  };
}

async function errors() {
  const d = await api('/errors', {limit: 120});
  if (!d.rows.length) return $('#main').innerHTML = '<div class="empty">no errors</div>';
  $('#main').innerHTML = `<table><thead><tr><th>time</th><th>tool</th><th>target</th>
    <th>message</th></tr></thead><tbody>${d.rows.map(r => `
    <tr class="ev err" data-sid="${r.sid}" data-seq="${r.seq}">
      <td class="t">${day(r.ts)} ${clock(r.ts)}</td>
      <td class="tool">${esc(r.tool || '')}</td>
      <td class="tg" title="${esc(r.target)}">${esc(r.target || '')}</td>
      <td><div class="snip">${esc(r.snip)}</div></td>
    </tr>`).join('')}</tbody></table>`;
  $('#main').onclick = e => {
    const tr = e.target.closest('tr.ev');
    if (tr) show(+tr.dataset.sid, +tr.dataset.seq);
  };
}

function bars(title, rows, cls = '') {
  if (!rows || !rows.length) return '';
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="bars"><h3>${title}</h3>${rows.map(([k, v]) => `
    <div class="bar ${cls}"><span class="lbl" title="${esc(k)}">${esc(k)}</span>
    <i style="width:${Math.max(2, 100 * v / max)}px"></i>
    <span class="v">${num(v)}</span></div>`).join('')}</div>`;
}

function stats() {
  const s = S.stats;
  $('#main').innerHTML = `
    <div class="cards">
      ${[['events', num(s.events)], ['sessions', s.sessions], ['indexed', mb(s.bytes)],
         ['unparsed', s.rejects]].map(([l, v]) =>
        `<div class="card"><b>${v}</b><span>${l}</span></div>`).join('')}
    </div>
    <div class="cols">
      ${bars('tool calls', s.tools)}
      ${bars('errors by tool', s.errors, 'e')}
      ${bars('models', s.models)}
    </div>`;
}

async function search(q) {
  if (!q.trim()) return render();
  const d = await api('/search', {q, limit: 80});
  if (d.error) return $('#main').innerHTML =
    `<div class="empty">${esc(d.error)}<br><br>syntax: term · "exact phrase" · A AND B · pre*</div>`;
  if (!d.hits.length) return $('#main').innerHTML = '<div class="empty">no matches</div>';
  const words = q.replace(/"/g, ' ').split(/\s+/).filter(w => w && !/^(AND|OR|NOT)$/.test(w));
  const hi = t => {
    let h = esc(t);
    for (const w of words)
      h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
    return h;
  };
  $('#main').innerHTML = `<table><thead><tr><th>when</th><th>session</th><th>tool</th>
    <th>match</th></tr></thead><tbody>${d.hits.map(h => `
    <tr class="ev ${h.err ? 'err' : ''}" data-sid="${h.sid}" data-seq="${h.seq}">
      <td class="t">${day(h.ts)} ${clock(h.ts)}</td>
      <td class="tg" title="${esc(h.ext)}">${esc(h.ext.split('/').pop())}</td>
      <td class="tool">${esc(h.tool || h.kind || '')}</td>
      <td><div class="snip">${hi(h.snip)}</div></td>
    </tr>`).join('')}</tbody></table>`;
  $('#main').onclick = e => {
    const tr = e.target.closest('tr.ev');
    if (tr) show(+tr.dataset.sid, +tr.dataset.seq);
  };
}

async function show(sid, seq) {
  const d = await api('/record', {sid, seq});
  const body = d.error ? esc(d.error)
    : d.raw ? esc(d.raw) : esc(JSON.stringify(d.json, null, 2));
  let el = $('#rec');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rec';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span class="x">&times;</span><pre>${body}</pre>`;
  el.querySelector('.x').onclick = () => el.remove();
}

document.onkeydown = e => { if (e.key === 'Escape') $('#rec')?.remove(); };
boot();
</script>
